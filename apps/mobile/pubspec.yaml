name: masaren
description: MASAREEN, Impact Infrastructure Platform mobile app
version: 0.2.0+2
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  url_launcher: ^6.2.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  video_player: ^2.8.1
  chewie: ^1.7.5
  flutter_local_notifications: ^17.0.0
  flutter_app_badge: ^2.0.0
  flutter_webrtc: ^0.12.0
  web_socket_channel: ^3.0.0
  visibility_detector: ^0.4.0
  path_provider: ^2.1.3
  audioplayers: ^6.1.0
  app_links: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

