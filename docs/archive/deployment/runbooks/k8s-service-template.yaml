# Template: Replace <SERVICE_NAME>, <PORT>, <IMAGE> accordingly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <SERVICE_NAME>
  namespace: masaren
  labels:
    app: <SERVICE_NAME>
    domain: <DOMAIN>
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <SERVICE_NAME>
  template:
    metadata:
      labels:
        app: <SERVICE_NAME>
    spec:
      containers:
        - name: <SERVICE_NAME>
          image: masaren/<IMAGE>:latest
          ports:
            - containerPort: <PORT>
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: <PORT>
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: <PORT>
            initialDelaySeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: <SERVICE_NAME>
  namespace: masaren
spec:
  selector:
    app: <SERVICE_NAME>
  ports:
    - port: 80
      targetPort: <PORT>
