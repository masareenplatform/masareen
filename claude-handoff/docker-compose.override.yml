# Local override: keep the heavy Node frontends (web/admin) out of the default
# `docker compose up` so the Flutter end-to-end audit (backend -> mobile UI) can
# run without building/booting the web/admin SPAs. Start them explicitly with:
#   docker compose --profile frontends up -d
services:
  web:
    profiles: ["frontends"]
  admin:
    profiles: ["frontends"]
