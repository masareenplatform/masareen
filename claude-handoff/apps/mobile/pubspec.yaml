name: masaren
description: MASAREN, Impact Infrastructure Platform mobile app
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  # Navigation
  go_router: ^14.0.0
  # HTTP & API
  dio: ^5.4.0
  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.0.0
  # GPS & location
  geolocator: ^11.0.0
  # Camera (evidence capture)
  camera: ^0.10.5
  # Maps (geofencing visualisation)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # QR code (Impact Passport)
  qr_flutter: ^4.1.0
  # Elegant typography (Cairo for Arabic / Latin)
  google_fonts: ^6.1.0
  # Local notifications (push via FCM is an optional follow-up, see docs)
  flutter_local_notifications: ^17.0.0
  # Utilities
  get_it: 7.6.9          # DI (pinned: 7.7.0 removed the top-level `getIt` accessor used app-wide)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  intl: ^0.19.0
  permission_handler: ^11.3.0   # runtime camera / location / notification permission prompts
  # Settings persistence (theme / haptics / sound toggles)
  shared_preferences: ^2.2.3
  # Reaction sound effects
  audioplayers: ^6.1.0
  # HLS / progressive video playback (m3u8 transcoded streams)
  video_player: ^2.8.1
  chewie: ^1.7.5
  # App log persistence (UI event logger)
  path_provider: ^2.1.3
  # Google OAuth sign-in
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  patrol: ^4.0.0            # native UI testing on emulator/device

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/sounds/
