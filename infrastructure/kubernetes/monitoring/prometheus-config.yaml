apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: masaren
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - "alert_rules.yml"

    scrape_configs:
      - job_name: 'masaren-services'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (identity-service|execution-service|verification-service|ai-orchestrator|billing-service|notification-service)
