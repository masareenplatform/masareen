# DO NOT COMMIT WITH REAL VALUES
# Use: kubectl create secret generic masaren-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: masaren-secrets
  namespace: masaren
type: Opaque
stringData:
  DATABASE_URL:      "postgresql+asyncpg://masaren_user:CHANGE_ME@masaren-postgres:5432/masaren_impact"
  REDIS_URL:         "redis://masaren-redis:6379"
  NEO4J_PASSWORD:    "CHANGE_ME"
  JWT_SECRET:        "CHANGE_ME_LONG_RANDOM_STRING"
  CLOUD_API_KEY:     "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
