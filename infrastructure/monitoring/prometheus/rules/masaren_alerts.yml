groups:
  - name: masaren.platform
    interval: 30s
    rules:

      # ── Service health ────────────────────────────────────────────────────
      - alert: ServiceDown
        expr: up{job=~"masaren-.*"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MASAREN service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} has been unreachable for > 2 minutes."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5..",job=~"masaren-.*"}[5m])
          / rate(http_requests_total{job=~"masaren-.*"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "Error rate {{ $value | humanizePercentage }} > 5%"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket{job=~"masaren-.*"}[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency > 2s on {{ $labels.job }}"

      # ── Kafka ─────────────────────────────────────────────────────────────
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag > 10000 messages"
          description: "Group {{ $labels.consumergroup }} topic {{ $labels.topic }}"

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker count < 1 — message bus offline"

      # ── PostgreSQL ────────────────────────────────────────────────────────
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80 (approaching limit)"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL replication lag > 30 seconds"

      # ── Outbox relay ──────────────────────────────────────────────────────
      - alert: OutboxRelayStalled
        expr: |
          masaren_outbox_unpublished_total > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox relay stalled — {{ $value }} unpublished events"
          description: "Events are not being relayed to Kafka. Check OutboxRelay process."

      # ── AI verification ───────────────────────────────────────────────────
      - alert: VerificationQueueBacklog
        expr: masaren_verification_queue_size > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Verification queue backlog > 200 items"

      - alert: CloudLLMHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(masaren_llm_request_duration_seconds_bucket[5m])
          ) > 10.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cloud LLM P95 latency > 10s — AI pipeline degraded"

      # ── Business metrics ──────────────────────────────────────────────────
      - alert: FraudRateHigh
        expr: |
          rate(masaren_fraud_detected_total[1h]) /
          rate(masaren_evidence_uploaded_total[1h]) > 0.10
        for: 30m
        labels:
          severity: critical
          team: trust-safety
        annotations:
          summary: "Fraud rate > 10% over last hour"
          description: "Potential coordinated fraud attack. Investigate immediately."
