# E2E Simulation: Opportunities browsing and apply
# Pre-condition: must be logged in
appId: com.masaren.app
---
- waitForAnimationToEnd:
    timeout: 3000
# Navigate to Explore/Opportunities (Tab 2)
- tapOn: "Tab 2 of 5"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_13_opportunities
- swipe:
    start: "540,1400"
    end: "540,800"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/e2e_13_opportunities_scrolled
# Try to apply - tap first opportunity if visible
- swipe:
    start: "540,800"
    end: "540,1400"
- waitForAnimationToEnd:
    timeout: 2000
# Back to feed
- tapOn: "Tab 1 of 5"
- waitForAnimationToEnd:
    timeout: 3000
