# E2E Simulation: Wallet economy
# Check wallet balance, scroll transactions, check exchange
# Pre-condition: must be logged in
appId: com.masaren.app
---
- waitForAnimationToEnd:
    timeout: 3000
# Navigate to Wallet via More menu
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Wallet"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_12_wallet_top
# Scroll down to see transactions
- swipe:
    start: "540,1400"
    end: "540,800"
- takeScreenshot: /tmp/e2e_12_wallet_scroll
# Back to feed
- tapOn: "Tab 1 of 5"
- waitForAnimationToEnd:
    timeout: 3000
