# E2E Simulation: Program journey
# Browse programs, navigate to courses, check enrollment
# Pre-condition: must be logged in
appId: com.masaren.app
---
- waitForAnimationToEnd:
    timeout: 3000
# Navigate to Programs tab in feed
- tapOn: "Programs"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_11_programs_tab

# Go to Courses (Tab 4)
- tapOn: "Tab 4 of 5"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_11_courses_tab
- swipe:
    start: "540,1400"
    end: "540,800"
- takeScreenshot: /tmp/e2e_11_courses_scroll

# Back to feed
- tapOn: "Tab 1 of 5"
- waitForAnimationToEnd:
    timeout: 3000
