# E2E Simulation: Full user journey (alpha tester first day)
# Starts fresh: onboarding → register → login → explore → create → profile → wallet → sign out
appId: com.masaren.app
---
# === Wait for splash ===
- waitForAnimationToEnd:
    timeout: 6000

# === Onboarding ===
# Swipe through 3 onboarding pages
- swipe:
    start: "800,1200"
    end: "200,1200"
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: "800,1200"
    end: "200,1200"
- waitForAnimationToEnd:
    timeout: 1000
# Tap Get Started (accessibilityText="Get Started" or "ابدأ الآن")
- tapOn: "Get Started"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/e2e_17_after_onboarding

# === Register ===
- tapOn: "Create an account"
- waitForAnimationToEnd:
    timeout: 5000
# Fill register form - name
- tapOn:
    point: "540,1050"
- inputText: "Alpha Tester"
# Email
- tapOn:
    point: "540,1200"
- inputText: "alpha.test@testmasaren.com"
# Password
- tapOn:
    point: "540,1350"
- inputText: "Masaren@1234"
# Confirm password
- tapOn:
    point: "540,1500"
- inputText: "Masaren@1234"
- takeScreenshot: /tmp/e2e_17_register_form
# Tap Sign Up
- tapOn: "Sign Up"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: /tmp/e2e_17_after_register

# If registration failed (email taken), fallback to login
- tapOn:
    point: "540,1158"
- inputText: "admin@masaren.org"
- tapOn:
    point: "540,1326"
- inputText: "Masaren@1234"
- tapOn: "Sign in"
- waitForAnimationToEnd:
    timeout: 15000

# === Explore feed ===
- tapOn: "For You"
- takeScreenshot: /tmp/e2e_17_feed
- swipe:
    start: "540,1400"
    end: "540,800"
- waitForAnimationToEnd:
    timeout: 2000

# === Create post ===
- tapOn: "Tab 3 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Story"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "540,600"
- inputText: "My first day on MASAREEN - excited to track my impact!"
- tapOn: "Post"
- waitForAnimationToEnd:
    timeout: 5000

# === Check profile ===
- tapOn: "Tab 4 of 5"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_17_profile

# === Check wallet ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Wallet"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_17_wallet

# === Theme toggle ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Theme"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/e2e_17_dark_mode

# === Language toggle ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "العربية"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/e2e_17_arabic

# === Sign out ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "تسجيل الخروج"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_17_signed_out
