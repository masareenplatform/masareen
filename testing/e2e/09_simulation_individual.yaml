# E2E Simulation: Individual user full session
# Simulates a regular individual user navigating all main screens
# Pre-condition: must be logged in
appId: com.masaren.app
---
# === Feed ===
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "For You"
- takeScreenshot: /tmp/e2e_09_feed_foryou
- tapOn: "Impact"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/e2e_09_feed_impact
- tapOn: "For You"
- waitForAnimationToEnd:
    timeout: 2000

# === Scroll feed ===
- swipe:
    start: "540,1400"
    end: "540,800"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/e2e_09_feed_scroll

# === Explore/Opportunities ===
- tapOn: "Tab 2 of 5"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_09_opportunities
- swipe:
    start: "540,1400"
    end: "540,800"
- takeScreenshot: /tmp/e2e_09_opportunities_scroll

# === More menu: Wallet ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Wallet"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_09_wallet

# === Back to more menu: Notifications ===
- tapOn: "Tab 5 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Notifications"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: /tmp/e2e_09_notifications

# === Back to feed ===
- tapOn: "Tab 1 of 5"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: /tmp/e2e_09_back_to_feed
