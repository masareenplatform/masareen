# AUDIT: `Platform Revenue & Fees` surface reachable from the menu sheet.
appId: com.masaren.app
---
- runFlow: login.yaml

- tapOn:
    id: "menu_button"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Platform Revenue & Fees"
    timeout: 10000
- tapOn: "Platform Revenue & Fees"
- waitForAnimationToEnd
- assertVisible: "Platform Revenue & Fees"
