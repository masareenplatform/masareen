# AUDIT: `Settings` surface reachable from the menu sheet.
appId: com.masaren.app
---
- runFlow: login.yaml

- tapOn:
    text: "Menu"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Settings"
    timeout: 10000
- tapOn: "Settings"
- waitForAnimationToEnd
- assertVisible: "Reactions & feedback"
