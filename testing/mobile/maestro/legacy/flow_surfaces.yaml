# MASAREN Mobile, Maestro E2E flow (login + the four monetisation surfaces).
#
# Drives the already-installed debug APK on the emulator. The app talks to the
# mock gateway on the host (10.0.2.2:8080). No app rebuild needed between runs.
#
# Run:
#   adb install -r android/build/app/outputs/flutter-apk/app-debug.apk
#   node testing/mobile/mock_gateway.mjs            # host :8080
#   maestro test testing/mobile/maestro/flow_surfaces.yaml --device emulator-5554
appId: com.masaren.app
---
- clearState
- launchApp
- waitForAnimationToEnd
- tapOn: "Sign in"
- waitForAnimationToEnd
- runFlow: login.yaml

# --- Wallet ---
- tapOn: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "MASAREN Coin"
- waitForAnimationToEnd
- assertVisible: "MASAREN Coin Wallet"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "Platform brokerage fee on monetizable actions: 2.50%"

# --- Ads Manager ---
