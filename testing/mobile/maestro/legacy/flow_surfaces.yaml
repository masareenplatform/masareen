- waitForAnimationToEnd
- tapOn: "Ads Manager"
- waitForAnimationToEnd
- assertVisible: "Ads Manager"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "Platform brokerage fee on ad budget: 2.50%"

# --- Payments ---
