# MASAREN — real-backend login subroutine (Maestro).
# App defaults its Dio baseUrl to http://10.0.2.2:8080/api/v1 (emulator -> host),
# so this authenticates against the SAME combined backend the web app uses.
appId: com.masaren.app
---
- clearState
- launchApp
- waitForAnimationToEnd
- tapOn: "Skip"
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: "alpha@masaren.dev"
- tapOn: "Password"
- inputText: "Test@12345"
- tapOn: "Sign In"
- waitForAnimationToEnd
- assertVisible: "MASAREN"
