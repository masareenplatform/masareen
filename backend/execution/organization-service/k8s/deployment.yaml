apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-service
  namespace: masaren
  labels:
    app: organization-service
    domain: execution
spec:
  replicas: 2
  selector:
    matchLabels:
      app: organization-service
  template:
    metadata:
      labels:
        app: organization-service
        domain: execution
    spec:
      containers:
        - name: organization-service
          image: masaren/organization-service:latest
          ports:
            - containerPort: 8004
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-organization-service
  namespace: masaren
spec:
  selector:
    app: organization-service
  ports:
    - port: 80
      targetPort: 8004
  type: ClusterIP
