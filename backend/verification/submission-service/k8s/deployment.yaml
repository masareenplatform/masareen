apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: masaren
  labels:
    app: submission-service
    domain: verification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
        domain: verification
    spec:
      containers:
        - name: submission-service
          image: masaren/submission-service:latest
          ports:
            - containerPort: 8011
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-submission-service
  namespace: masaren
spec:
  selector:
    app: submission-service
  ports:
    - port: 80
      targetPort: 8011
  type: ClusterIP
