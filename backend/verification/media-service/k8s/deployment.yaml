apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: masaren
  labels:
    app: media-service
    domain: verification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
        domain: verification
    spec:
      containers:
        - name: media-service
          image: masaren/media-service:latest
          ports:
            - containerPort: 8012
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-media-service
  namespace: masaren
spec:
  selector:
    app: media-service
  ports:
    - port: 80
      targetPort: 8012
  type: ClusterIP
