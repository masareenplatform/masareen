apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: masaren
  labels:
    app: matching-service
    domain: marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
        domain: marketplace
    spec:
      containers:
        - name: matching-service
          image: masaren/matching-service:latest
          ports:
            - containerPort: 8019
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8019
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8019
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-matching-service
  namespace: masaren
spec:
  selector:
    app: matching-service
  ports:
    - port: 80
      targetPort: 8019
  type: ClusterIP
