apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  namespace: masaren
  labels:
    app: portfolio-service
    domain: reputation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
        domain: reputation
    spec:
      containers:
        - name: portfolio-service
          image: masaren/portfolio-service:latest
          ports:
            - containerPort: 8016
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8016
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8016
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-portfolio-service
  namespace: masaren
spec:
  selector:
    app: portfolio-service
  ports:
    - port: 80
      targetPort: 8016
  type: ClusterIP
