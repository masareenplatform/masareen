apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: masaren
  labels:
    app: report-service
    domain: reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
        domain: reporting
    spec:
      containers:
        - name: report-service
          image: masaren/report-service:latest
          ports:
            - containerPort: 8020
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-report-service
  namespace: masaren
spec:
  selector:
    app: report-service
  ports:
    - port: 80
      targetPort: 8020
  type: ClusterIP
