apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: masaren
  labels:
    app: notification-service
    domain: notifications
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        domain: notifications
    spec:
      containers:
        - name: notification-service
          image: masaren/notification-service:latest
          ports:
            - containerPort: 8022
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8022
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8022
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-notification-service
  namespace: masaren
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 8022
  type: ClusterIP
