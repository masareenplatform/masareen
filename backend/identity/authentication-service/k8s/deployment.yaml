apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: masaren
  labels:
    app: authentication-service
    domain: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
        domain: identity
    spec:
      containers:
        - name: authentication-service
          image: masaren/authentication-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-authentication-service
  namespace: masaren
spec:
  selector:
    app: authentication-service
  ports:
    - port: 80
      targetPort: 8002
  type: ClusterIP
