apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: masaren
  labels:
    app: identity-service
    domain: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        domain: identity
    spec:
      containers:
        - name: identity-service
          image: masaren/identity-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: masaren-secrets
            - configMapRef:
                name: masaren-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: masaren-identity-service
  namespace: masaren
spec:
  selector:
    app: identity-service
  ports:
    - port: 80
      targetPort: 8001
  type: ClusterIP
