name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'landing/**', '.github/workflows/cloudflare-deploy.yml']
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloudflare } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full Worker & Social API test suite
        run: npm test
      - name: Apply D1 database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run db:migrate:all
      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Upload static landing pages to R2
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: landing
        run: bash ./upload-to-r2.sh masareen-landing
