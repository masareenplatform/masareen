name: Build iOS IPA (Codemagic + unsigned fallback)

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'codemagic.yaml', '.github/workflows/ios-ipa.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL baked into the app (blank = https://masareen.com)'
        required: false
        default: 'https://masareen.com'
      publish_release:
        description: 'Publish as GitHub Release "latest-ios-ipa"'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  codemagic-ipa:
    name: Build iOS IPA via Codemagic (Apple Silicon M2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEMAGIC_API_KEY: ${{ secrets.CODEMAGIC_API_KEY }}
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://masareen.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Trigger and download iOS IPA from Codemagic
        if: env.CODEMAGIC_API_KEY != ''
        run: |
          node tools/codemagic-ios-build.mjs --trigger --wait --download masareen-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: env.CODEMAGIC_API_KEY != ''
        with: { name: masareen-ios-ipa, path: masareen-unsigned.ipa }
      - name: Publish release
        if: env.CODEMAGIC_API_KEY != '' && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest-ios-ipa --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-ios-ipa masareen-unsigned.ipa \
            --title "MASAREEN iOS IPA (unsigned)" \
            --notes "Compiled on Codemagic Apple Silicon with Firebase Cloud Messaging (FCM). Install with Sideloadly or AltStore."
