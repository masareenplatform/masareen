# MASAREEN on Cloudflare (all free tier): Worker API + D1 database.
# The landing page is hosted in an R2 bucket (custom domain). This Worker only
# answers /api/*. Two supported wirings:
#   A) Same domain (recommended): add the Worker route masareen.com/api/* below.
#      The R2 custom domain keeps serving everything else, no CORS needed.
#   B) Separate host: give the Worker a custom domain such as api.masareen.com
#      and set ALLOWED_ORIGINS + (optionally) COOKIE_DOMAIN below.
name = "masareen"
main = "src/index.js"
compatibility_date = "2025-01-01"

# --- Wiring A: same-domain API route (enabled) ---
# A Worker route intercepts only /api/* while the R2 custom domain serves the rest.
routes = [
  { pattern = "masareen.com/api/*", zone_name = "masareen.com" },
  { pattern = "www.masareen.com/api/*", zone_name = "masareen.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "masareen"
database_id = "a14a1b7c-a93e-4030-b58a-eaa908e61e37"

[vars]
# Public OAuth client ID from Google Cloud Console (project "masareen").
# Authorized JavaScript origin already configured: https://masareen.com
# For local testing add http://localhost:8787 in Google Console. If you serve
# the site on www.masareen.com (or api.masareen.com), add those origins too.
GOOGLE_CLIENT_ID = "336070303963-cksadpqp8d591afvir53vsb86fl41cqj.apps.googleusercontent.com"
# Comma separated Google emails allowed to open /admin.html (the CEO and team).
ADMIN_EMAILS = "masareen.platform@gmail.com"
# Origins allowed to call the API when it is on a different host than the site.
# Leave empty to use the defaults (masareen.com, www.masareen.com, localhost).
ALLOWED_ORIGINS = ""
# Optional shared parent domain for the session cookie when the API is on a
# subdomain, e.g. ".masareen.com". Leave empty for a host-only cookie.
COOKIE_DOMAIN = ""
# Email (Resend). Sending from verified notify.masareen.com
MAIL_FROM = "MASAREEN <hello@notify.masareen.com>"
CONTACT_TO = "masareen.platform@gmail.com"
MAIL_REPLY_TO = "hello@notify.masareen.com"
# Set to "true" to also email the user a copy of their contact message
CONTACT_COPY_USER = "false"

# --- Wiring B: separate API host (free Worker custom domain, TLS included) ---
# routes = [{ pattern = "api.masareen.com", custom_domain = true }]

# Secret (never put in this file):  npx wrangler secret put SESSION_SECRET

# Optional: serve a local copy of the landing page from the Worker while
# developing (npx wrangler dev). Production serves it from R2.
# [assets]
# directory = "../landing"
# binding = "ASSETS"
# run_worker_first = ["/api/*"]
